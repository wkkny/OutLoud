[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-dump"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "filelock==4.0.9",
    "fsspec==2026.9.0",
    "idna==3.20",
    "jinja2==3.1.6",
    "llvmlite==0.50.0",
    "markupsafe==3.0.3",
    "more-itertools==11.1.0",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numba==0.68.0",
    "numpy==2.4.6",
    "openai-whisper==20250625",
    "pycparser==3.0",
    "pyobjc-framework-quartz>=12.2.2",
    "regex==2026.9.29",
    "requests==2.34.2",
    "scipy==1.17.1",
    "setuptools==84.0.0",
    "sounddevice==0.5.6",
    "sympy==1.14.0",
    "tiktoken==0.14.0",
    "torch==2.14.1",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
]

[project.scripts]
voice-dump = "voice_dump.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_dump"]
