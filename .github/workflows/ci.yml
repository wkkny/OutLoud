name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # Reads the Bun version from package.json's packageManager field.
      - name: Validate web
        run: bun run check -- --filter=@outloud/web

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          enable-cache: true
          prune-cache: true
      - name: Install PortAudio on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libportaudio2
      - name: Install Python
        # Reads the Python version from .python-version.
        run: uv python install
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Validate backend
        run: bun run check -- --filter=@outloud/backend

  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [web, backend]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          echo "Web: $WEB_RESULT"
          echo "Backend matrix: $BACKEND_RESULT"
          test "$WEB_RESULT" = success
          test "$BACKEND_RESULT" = success
